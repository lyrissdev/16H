<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Home Mindmap</title>
<style>
  :root{
    --bg:#fcfcfd; --grid:#dfe4ec; --ink:#17191d; --muted:#6f7785;
    --purple:#8b3dff; --purple2:#efe5ff; --blue:#42b7ea; --yellow:#ffdd58;
    --shadow:0 12px 34px rgba(22,26,33,.12),0 2px 8px rgba(22,26,33,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,"Open Sans",Arial,sans-serif;color:var(--ink);background:var(--bg)}
  button,input,select{font:inherit}
  button{color:inherit}
  #app{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg)}
  #viewport{
    position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;
    background-color:var(--bg);
    background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.25px);
    background-repeat:repeat;
  }
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #nodeLayer{position:absolute;left:0;top:0;overflow:visible}
  .node{
    position:absolute;user-select:none;transform-origin:center center;
    display:flex;align-items:center;justify-content:center;overflow:visible;
    min-width:10px;min-height:10px;
  }
  .node.locked{cursor:not-allowed}
  .node:not(.editing):not(.locked){cursor:grab}
  .node.dragging{cursor:grabbing}
  .node.hoverable:hover::after{
    content:"";position:absolute;inset:-2px;border:1px solid rgba(139,61,255,.28);
    border-radius:inherit;pointer-events:none;
  }
  .node-text{
    width:100%;height:100%;padding:10px 14px;display:flex;align-items:center;justify-content:center;
    text-align:center;white-space:pre-wrap;word-break:break-word;outline:none;box-sizing:border-box;line-height:1.2;overflow:hidden;
  }
  .node.editing .node-text{overflow:auto;user-select:text;cursor:text;outline:none}
  .node-text[contenteditable="true"]{user-select:text;cursor:text}
  .sticky .node-text{align-items:flex-start;justify-content:flex-start;text-align:left;padding:16px}
  .text-node .node-text{padding:2px 4px;justify-content:flex-start;text-align:left}
  .section .node-text{align-items:flex-start;justify-content:flex-start;padding:16px 20px;font-weight:800}
  .diamond .shape-bg{position:absolute;inset:0;transform:rotate(45deg);border-radius:8px}
  .diamond .node-text{position:relative;z-index:1}
  .draw-node svg{width:100%;height:100%;overflow:visible;display:block}
  .table-node{display:block;background:white;border:1px solid #222}
  .table-node table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed}
  .table-node td{border:1px solid #222;padding:6px;vertical-align:top;outline:none;user-select:text}

  #connectorSvg,#selectionSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #connectorOverlay{position:absolute;inset:0;z-index:18;pointer-events:none}
  .connector-handle{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #bcc5d1;box-shadow:0 1px 4px rgba(0,0,0,.16);transform:translate(-50%,-50%);pointer-events:auto;cursor:grab}
  .connector-handle:active{cursor:grabbing}
  #connectorSvg{z-index:2}
  #selectionSvg{z-index:8}
  #world{z-index:4}
  .connector-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
  .connector-visible{fill:none;stroke:#17191d;stroke-width:2}
  .connector-label{
    position:absolute;z-index:6;background:#fff;padding:2px 6px;border-radius:6px;font-size:12px;
    transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:auto;
  }

  #marquee{position:absolute;display:none;z-index:15;border:1px solid var(--purple);background:rgba(139,61,255,.08);pointer-events:none}
  #smartV,#smartH{position:absolute;z-index:14;background:#d93cff;display:none;pointer-events:none}
  #smartV{width:1px;top:0;bottom:0}
  #smartH{height:1px;left:0;right:0}

  #selectionBox{
    position:absolute;z-index:20;border:2px solid var(--purple);display:none;pointer-events:none;
    transform-origin:center center;
  }
  .handle{
    position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid #aeb6c3;border-radius:50%;
    box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:auto;
  }
  .handle.side{border-radius:5px}
  .h-nw{left:-7px;top:-7px;cursor:nwse-resize}.h-n{left:50%;top:-7px;transform:translateX(-50%);cursor:ns-resize}
  .h-ne{right:-7px;top:-7px;cursor:nesw-resize}.h-e{right:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
  .h-se{right:-7px;bottom:-7px;cursor:nwse-resize}.h-s{left:50%;bottom:-7px;transform:translateX(-50%);cursor:ns-resize}
  .h-sw{left:-7px;bottom:-7px;cursor:nesw-resize}.h-w{left:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
  #rotateHandle{
    position:absolute;left:calc(50% - 36px);top:auto;bottom:-126px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;
    background:#fff;border:1px solid #ccd1da;box-shadow:0 2px 7px rgba(0,0,0,.14);pointer-events:auto;cursor:grab;
    display:grid;place-items:center;font-size:0;
  }
  #rotateStem{display:none!important}

  .quick{
    position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #cbd1da;
    box-shadow:0 2px 7px rgba(0,0,0,.14);display:none;place-items:center;pointer-events:auto;cursor:pointer;
    font-size:21px;line-height:1;
  }
  #qUp{left:50%;top:-72px;transform:translateX(-50%)}#qDown{left:50%;bottom:-72px;transform:translateX(-50%)}
  #qLeft{left:-54px;top:50%;transform:translateY(-50%)}#qRight{right:-54px;top:50%;transform:translateY(-50%)}

  #leftToolbar{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:40;width:58px;padding:10px 7px;
    border-radius:24px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:center;
  }
  .tool{
    width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    font-size:20px;position:relative;
  }
  .tool:hover{background:#f4f5f7}.tool.active{background:var(--purple2);color:#6632c2}
  .tool.active::after{content:"";position:absolute;right:-3px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--purple)}
  .tool svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tool svg{display:none}
  .tool-icon,.tb-icon,.quick-icon,.rotate-icon{display:block;object-fit:contain;pointer-events:none}
  .tool-icon{width:24px;height:24px}
  .quick-icon{width:18px;height:18px}
  .rotate-icon{width:18px;height:18px}
  .tb-icon{width:22px;height:22px;object-fit:contain}
  .tb-icon.wide{width:24px;height:24px;object-fit:contain}
  .tb-btn.icon{display:grid;place-items:center}
  .tb-btn.icon img{width:28px;height:28px;object-fit:contain}
  .tb-btn.icon.active{background:#efe5ff}
  .canva-swatch,.line-style-btn,.connector-style-icon,.text-color-btn,.bullets-icon,.spacing-icon,.more-icon{display:grid;place-items:center;position:relative}
  .canva-swatch input,.text-color-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .canva-swatch .swatch-disc,.line-style-btn .lines,.connector-style-icon:before,.connector-style-icon:after,.text-color-btn:after{display:none!important}
  #fontSizeWrap button{display:grid;place-items:center;font-size:0}
  #fontSizeWrap button img{width:20px;height:20px;object-fit:contain}
  #rotateHandle{font-size:0}
  .quick{font-size:0}

  #closeBtn{
    position:absolute;left:14px;top:12px;z-index:41;width:42px;height:42px;border-radius:50%;border:0;background:#fff;
    box-shadow:var(--shadow);font-size:32px;line-height:1;cursor:pointer
  }

  #topbar{
    position:absolute;left:68px;top:12px;z-index:35;background:rgba(255,255,255,.98);
    border:1px solid #e2e5ea;display:none;align-items:center;gap:4px;padding:5px 8px;
    overflow-x:auto;overflow-y:hidden;white-space:nowrap;backdrop-filter:blur(10px);border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);width:max-content;max-width:none;height:54px
  }
  #topbar.show{display:flex}
  .tb-btn,.tb-select,.tb-input{height:38px;border:0;background:transparent;border-radius:10px;padding:0;cursor:pointer;flex:0 0 auto}
  .tb-btn:hover,.tb-select:hover{background:#f4f3f7}
  .tb-btn.icon{width:38px;min-width:38px;max-width:38px;padding:0;font-size:22px;display:grid;place-items:center}
  .tb-btn.active{background:#efe5ff;color:#5d2ca7;font-weight:800}
  .tb-sep{width:1px;height:28px;background:#e1e4e9;flex:0 0 auto;margin:0 2px}
  #topbar > *{box-sizing:border-box}
  #topbar img{display:block}

  .canva-swatch{width:38px;height:38px;min-width:38px;max-width:38px;border:0;background:transparent;border-radius:10px;padding:0;cursor:pointer;position:relative;flex:0 0 38px}
  .canva-swatch:hover{background:#f4f3f7}
  .canva-swatch .swatch-disc{width:32px;height:32px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
  .canva-swatch input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .line-style-btn{width:38px;height:38px;min-width:38px;max-width:38px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:0 0 38px}
  .line-style-btn:hover{background:#f4f3f7}
  .line-style-btn .lines{width:27px;height:22px;display:flex;flex-direction:column;justify-content:space-between}
  .line-style-btn .lines i{display:block;height:3px;border-radius:4px;background:#17191d}
  .connector-style-icon{width:38px;height:38px;min-width:38px;max-width:38px;border:0;background:transparent;border-radius:10px;position:relative;cursor:pointer;flex:0 0 38px}
  .connector-style-icon:hover{background:#f4f3f7}
  .connector-style-icon:before{content:"";position:absolute;left:12px;top:28px;width:19px;height:14px;border-left:3px solid #17191d;border-top:3px solid #17191d;border-radius:11px 0 0 0}
  .connector-style-icon:after{content:"";position:absolute;right:9px;top:10px;width:8px;height:8px;background:#17191d;border-radius:50%}
  .font-canva{height:46px;width:200px;min-width:200px;max-width:200px;flex:0 0 200px;border:1px solid #d8dce5;border-radius:12px;background:#fff;padding:0 14px;font-size:18px;cursor:pointer}
  #fontSizeWrap{display:flex;align-items:center;border:1px solid #d8dce5;border-radius:12px;height:46px;width:142px;min-width:142px;max-width:142px;flex:0 0 142px;overflow:hidden;background:#fff}
  #fontSizeWrap button{height:100%;width:42px;min-width:42px;border:0;background:#fff;cursor:pointer;font-size:22px}
  #fontSizeWrap button:hover{background:#f5f5f7}
  #fontSizeWrap input{width:58px;min-width:58px;text-align:center;border:0;outline:none;font-size:18px;font-weight:600}
  .text-color-btn{width:46px;height:46px;min-width:46px;max-width:46px;flex:0 0 46px;border:0;background:transparent;border-radius:12px;position:relative;cursor:pointer;font-size:29px;font-family:Georgia,serif;line-height:1}
  .text-color-btn:hover{background:#f4f3f7}
  .text-color-btn:after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:5px;border-radius:6px;background:linear-gradient(90deg,#ff3b30,#ffcc00,#34c759,#00a7ff,#8b3dff,#ff2d55)}
  .text-color-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .align-canva{height:46px;width:46px;min-width:46px;max-width:46px;flex:0 0 46px;border:0;background:transparent;border-radius:12px;padding:0;font-size:0;cursor:pointer;appearance:none;-webkit-appearance:none;color:transparent}
  .align-canva:hover{background:#f4f3f7}
  .align-canva option{font-size:16px}

  .bullets-icon,.spacing-icon,.more-icon{width:46px;height:46px;min-width:46px;max-width:46px;border:0;background:transparent;border-radius:12px;cursor:pointer;font-size:24px;display:grid;place-items:center;flex:0 0 46px}
  .bullets-icon:hover,.spacing-icon:hover,.more-icon:hover{background:#f4f3f7}
  #filebar{position:absolute;right:16px;top:14px;z-index:31;display:flex;gap:7px;background:#fff;border:1px solid #e2e5ea;border-radius:18px;padding:6px 10px;box-shadow:0 5px 20px rgba(0,0,0,.08);height:62px;align-items:center}
  #filebar button{border:0;background:#fff;border-radius:11px;padding:0 10px;height:46px;cursor:pointer}
  #filebar button:hover{background:#f4f5f7}

  #zoomControls{
    position:absolute;right:18px;bottom:18px;z-index:40;background:#fff;box-shadow:var(--shadow);border-radius:14px;
    padding:5px;display:flex;align-items:center;gap:3px
  }
  #zoomControls button{border:0;background:#fff;height:34px;min-width:34px;border-radius:9px;cursor:pointer}
  #zoomControls button:hover{background:#f3f4f6}
  #zoomPct{font-size:13px;min-width:64px!important}
  #fitBtn{padding:0 10px!important}

  .popover{
    position:absolute;z-index:60;background:#fff;border:1px solid #e0e3e9;border-radius:14px;box-shadow:var(--shadow);
    padding:8px;display:none
  }
  .popover.show{display:block}
  #shapePalette{left:94px;top:50%;transform:translateY(-10%);width:190px}
  .shape-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .shape-grid button{height:44px;border:1px solid #e2e5ea;background:#fff;border-radius:10px;cursor:pointer}
  .shape-grid button:hover{background:#f5f6f8}
  #contextMenu{min-width:210px;padding:6px}
  #contextMenu button{width:100%;border:0;background:#fff;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
  #contextMenu button:hover{background:#f3f4f6}
  #contextMenu hr{border:0;border-top:1px solid #eceef2;margin:5px 0}

  #toast{
    position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;background:#17191d;color:white;
    border-radius:10px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.18s
  }
  #toast.show{opacity:1}


  /* V12 color palette + local image import */
  .color-popover{width:310px;padding:16px;border-radius:18px}
  .color-popover .cp-title{font-size:18px;font-weight:800;margin:0 0 12px}
  .color-popover .cp-current{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .color-popover .cp-custom{width:42px;height:42px;border-radius:50%;border:1px solid #d9dde5;overflow:hidden;position:relative;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer}
  .color-popover .cp-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .color-popover .cp-label{font-size:13px;color:#6f7785}
  .color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .color-chip{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;position:relative;padding:0}
  .color-chip:hover{transform:scale(1.08)}
  .color-chip.active::after{content:"";position:absolute;inset:-4px;border:2px solid var(--purple);border-radius:50%}
  .color-section-label{font-size:13px;color:#6f7785;margin:14px 0 9px}
  .image-node{background:transparent!important;border:0!important;overflow:hidden}
  .image-node img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;user-select:none}
  .image-node.crop-editing{cursor:move}
  .image-node.crop-editing::after{content:"Recadrage — faites glisser l’image";position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:5px 9px;border-radius:8px;font-size:11px;white-space:nowrap;pointer-events:none}
  .image-toolbar-btn{height:34px;border:0;background:transparent;border-radius:9px;padding:0 10px;font-weight:650;cursor:pointer}
  .image-toolbar-btn:hover,.image-toolbar-btn.active{background:#efe5ff;color:#5d2ca7}
  .shape-grid .import-image-btn{grid-column:1/-1;font-weight:700;background:#f7f3ff;border-color:#e5d8ff;color:#5d2ca7}

  @media(max-width:1100px){
    #filebar{display:none}
    #topbar{max-width:calc(100vw - 120px)!important}
  }

  /* V10 compact Canva-like controls */
  #topbar{height:48px;gap:2px;padding:4px 7px;border-radius:15px;left:66px;top:10px}
  #topbar .tb-btn,#topbar .tb-select,#topbar .tb-input{height:34px;border-radius:9px}
  #topbar .tb-btn.icon{width:34px;min-width:34px;max-width:34px;height:34px}
  #topbar .tb-btn.icon img{width:22px;height:22px}
  #topbar .canva-swatch,#topbar .line-style-btn,#topbar .connector-style-icon,#topbar .text-color-btn,#topbar .bullets-icon,#topbar .spacing-icon,#topbar .more-icon{width:34px!important;min-width:34px!important;max-width:34px!important;height:34px!important;flex:0 0 34px!important;border-radius:9px!important}
  #topbar .tb-icon{width:20px!important;height:20px!important}
  #topbar .tb-icon.wide{width:22px!important;height:22px!important}
  #topbar .font-canva{height:34px!important;width:150px!important;min-width:150px!important;max-width:150px!important;flex:0 0 150px!important;border-radius:10px!important;padding:0 10px!important;font-size:14px!important}
  #topbar #fontSizeWrap{height:34px!important;width:104px!important;min-width:104px!important;max-width:104px!important;flex:0 0 104px!important;border-radius:10px!important}
  #topbar #fontSizeWrap button{width:30px!important;min-width:30px!important;height:34px!important}
  #topbar #fontSizeWrap button img{width:16px!important;height:16px!important}
  #topbar #fontSizeWrap input{width:44px!important;min-width:44px!important;font-size:15px!important}
  #topbar .align-canva{height:34px!important;width:34px!important;min-width:34px!important;max-width:34px!important;flex:0 0 34px!important;border-radius:9px!important;background-size:20px 20px!important;background-position:center!important}
  #topbar .tb-sep{height:24px!important;margin:0 1px!important}
  .dynamic-fill-disc{display:block;width:27px;height:27px;border-radius:50%;border:1px solid rgba(0,0,0,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
  #filebar{height:48px;top:10px;padding:5px 7px;border-radius:15px;gap:2px}
  #filebar button{height:34px;padding:0 9px;font-size:13px;border-radius:9px}
  #closeBtn{width:38px;height:38px;left:12px;top:10px;font-size:28px}


  /* V11: keep toolbar icons fully visible */
  #topbar{overflow-x:auto;overflow-y:visible;scrollbar-width:none}
  #topbar::-webkit-scrollbar{display:none}
  #topbar button,#topbar select{overflow:visible}
  #topbar img{max-width:100%;max-height:100%;object-fit:contain;object-position:center;overflow:visible}
  .tb-btn.icon img{width:22px!important;height:22px!important;padding:1px}
  .tb-icon,.tb-icon.wide{width:21px!important;height:21px!important;padding:1px}
  .format-glyph{width:22px;height:22px;display:grid;place-items:center;font-size:21px;line-height:1;color:#17191d;font-family:Arial,sans-serif;font-weight:500;overflow:visible}
  .format-glyph.strike{text-decoration:line-through}
  .format-glyph.italic{font-family:Georgia,serif;font-style:italic;font-size:24px}
  .format-glyph.underline{text-decoration:underline;text-underline-offset:3px}
  .format-glyph.case{font-size:18px;letter-spacing:-1px;white-space:nowrap}
  .format-svg{width:22px;height:22px;display:block;overflow:visible}
  .border-popover{width:280px;padding:12px;z-index:80}
  .border-popover.show{display:block}
  .bp-row{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:center;min-height:38px;font-size:13px}
  .bp-row select{height:32px;border:1px solid #dfe3e9;border-radius:9px;background:#fff;padding:0 8px}
  .bp-row input[type="range"]{width:100%}
  .bp-row output{min-width:26px;text-align:right;color:#626a77}
  .bp-color{width:32px;height:32px;border-radius:9px;border:1px solid #dfe3e9;overflow:hidden;display:block}
  .bp-color input{width:100%;height:100%;border:0;padding:0;cursor:pointer}
  .radius-presets{display:flex;gap:6px;margin-top:8px}
  .radius-presets button{flex:1;height:30px;border:1px solid #dfe3e9;background:#fff;border-radius:8px;cursor:pointer;font-size:12px}
  .radius-presets button:hover{background:#f4f3f7}

</style>

<script>
(() => {
"use strict";
const hostParams=new URLSearchParams(location.search);
const HOST_MODE=hostParams.get("host")==="16h";
const HOST_BLOCK_ID=hostParams.get("blockId")||"standalone";
const HOST_BLOCK_TITLE=hostParams.get("title")||"Tâche";
const STORAGE_KEY=HOST_MODE?`16h.mindmap.${HOST_BLOCK_ID}`:"homeMindmapEditor.v1";
const ICONS = {
  "floating_comment_add": "asset/floating_comment_add.png",
  "floating_delete": "asset/floating_delete.png",

  "top_plus": "asset/top_plus.png",

};

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const viewport = $("#viewport"), world = $("#world"), nodeLayer = $("#nodeLayer"), connectorSvg = $("#connectorSvg");
const selectionBox = $("#selectionBox"), marquee = $("#marquee"), topbar = $("#topbar"), connectorOverlay = $("#connectorOverlay");
const smartV = $("#smartV"), smartH = $("#smartH"), contextMenu = $("#contextMenu"), shapePalette=$("#shapePalette"), borderPopover=$("#borderPopover"), colorPopover=$("#colorPopover");
const PURPLE="#8b3dff";
let clipboard = null, interaction = null, spaceDown=false, editingId=null, cropEditingId=null, pendingTextBefore=null;
let lastNodePointerId=null, lastNodePointerAt=0, selectedConnectorId=null;
let rafPending=false, toastTimer=null, colorTarget=null;
const assetURLCache=new Map();

const clone = obj => JSON.parse(JSON.stringify(obj));
const uid = p => p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

const ASSET_DB="homeMindmapLocalAssets", ASSET_STORE="images";
function openAssetDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(ASSET_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ASSET_STORE))db.createObjectStore(ASSET_STORE)};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function putLocalAsset(id,blob){const db=await openAssetDB();await new Promise((res,rej)=>{const tx=db.transaction(ASSET_STORE,"readwrite");tx.objectStore(ASSET_STORE).put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
async function getLocalAsset(id){const db=await openAssetDB();const blob=await new Promise((res,rej)=>{const req=db.transaction(ASSET_STORE,"readonly").objectStore(ASSET_STORE).get(id);req.onsuccess=()=>res(req.result||null);req.onerror=()=>rej(req.error)});db.close();return blob}
async function getLocalAssetURL(id){
  if(assetURLCache.has(id))return assetURLCache.get(id);
  const blob=await getLocalAsset(id);if(!blob)return null;
  const url=URL.createObjectURL(blob);assetURLCache.set(id,url);return url;
}
function imageDimensions(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{resolve({w:im.naturalWidth||320,h:im.naturalHeight||240});URL.revokeObjectURL(u)};im.onerror=()=>{URL.revokeObjectURL(u);reject(new Error("Image illisible"))};im.src=u})}

function defaultStyle(kind="rect"){
  const common={fill:"#ffffff",stroke:"#17191d",strokeWidth:2,radius:0,fontFamily:"Open Sans, Arial, sans-serif",fontSize:16,fontWeight:700,fontStyle:"normal",textDecoration:"none",textColor:"#17191d",textAlign:"center",opacity:1,borderStyle:"solid"};
  if(kind==="person") return {...common,fill:"#42b7ea",strokeWidth:2,fontSize:14};
  if(kind==="task") return {...common,fill:"#ffdd58",radius:24,fontSize:16};
  if(kind==="sticky") return {...common,fill:"#ffdd58",stroke:"transparent",strokeWidth:0,radius:4,fontWeight:500,textAlign:"left"};
  if(kind==="section") return {...common,fill:"#d1d1d1",strokeWidth:2,radius:0,fontSize:18,textAlign:"left"};
  if(kind==="text") return {...common,fill:"transparent",stroke:"transparent",strokeWidth:0,fontSize:22,fontWeight:500,textAlign:"left"};
  return common;
}
function el(type,x,y,w,h,text,kind="rect",style={}){
  return {id:uid("el"),type,kind,x,y,w,h,rotation:0,z:10,locked:false,style:{...defaultStyle(kind),...style},text:text||"",groupId:null};
}
function anchorFor(a){
  const e=getEl(a.elementId); if(!e) return {x:0,y:0};
  const x=e.x,y=e.y,w=e.w,h=e.h;
  if(a.anchor==="top") return {x:x+w/2,y};
  if(a.anchor==="bottom") return {x:x+w/2,y:y+h};
  if(a.anchor==="left") return {x,y:y+h/2};

function exportPNG(){
  const nodes=state.elements;if(!nodes.length)return;const l=Math.min(...nodes.map(e=>e.x))-40,t=Math.min(...nodes.map(e=>e.y))-40,r=Math.max(...nodes.map(e=>e.x+e.w))+40,b=Math.max(...nodes.map(e=>e.y+e.h))+40,w=Math.ceil(r-l),h=Math.ceil(b-t);
  const canvas=document.createElement("canvas");canvas.width=Math.min(4096,w);canvas.height=Math.min(4096,h);const ctx=canvas.getContext("2d");ctx.fillStyle="#fcfcfd";ctx.fillRect(0,0,canvas.width,canvas.height);
  const sx=canvas.width/w,sy=canvas.height/h,sc=Math.min(sx,sy);ctx.scale(sc,sc);ctx.translate(-l,-t);
  state.connectors.forEach(c=>{const a=endpoint(c,"from"),bb=endpoint(c,"to");ctx.strokeStyle=c.style.color||"#17191d";ctx.lineWidth=c.style.width||2;ctx.beginPath();ctx.moveTo(a.x,a.y);if(c.type==="straight")ctx.lineTo(bb.x,bb.y);else{const mx=(a.x+bb.x)/2;ctx.lineTo(mx,a.y);ctx.lineTo(mx,bb.y);ctx.lineTo(bb.x,bb.y)}ctx.stroke()});
  [...state.elements].sort((a,b)=>(a.z||0)-(b.z||0)).forEach(e=>{
    if(e.type==="draw"){ctx.save();ctx.translate(e.x,e.y);ctx.strokeStyle=e.style.stroke||"#ff334d";ctx.lineWidth=e.style.strokeWidth||4;ctx.beginPath();(e.points||[]).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();return}
    ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);ctx.rotate((e.rotation||0)*Math.PI/180);ctx.translate(-e.w/2,-e.h/2);
    ctx.globalAlpha=e.style.opacity??1;ctx.fillStyle=e.style.fill==="transparent"?"rgba(0,0,0,0)":e.style.fill||"#fff";ctx.strokeStyle=e.style.stroke||"transparent";ctx.lineWidth=e.style.strokeWidth||0;
    roundRect(ctx,0,0,e.w,e.h,e.kind==="circle"?Math.min(e.w,e.h)/2:(e.style.radius||0));ctx.fill();if(e.style.strokeWidth)ctx.stroke();
    if(e.type!=="section"||e.text){ctx.fillStyle=e.style.textColor||"#17191d";ctx.font=`${e.style.fontStyle||"normal"} ${e.style.fontWeight||500} ${e.style.fontSize||16}px Arial`;ctx.textAlign=e.style.textAlign||"center";ctx.textBaseline="middle";drawWrapped(ctx,e.text,e.style.textAlign==="left"?14:e.w/2,e.h/2,e.w-28,e.style.fontSize*1.2,e.style.textAlign||"center")}
    ctx.restore();
  });
  canvas.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="home-mindmap.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"image/png")
}
function roundRect(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawWrapped(ctx,text,x,y,maxW,lineH,align){const words=String(text||"").split(/\s+/),lines=[];let line="";words.forEach(w=>{const test=line?line+" "+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w}else line=test});if(line)lines.push(line);const start=y-(lines.length-1)*lineH/2;lines.forEach((ln,i)=>ctx.fillText(ln,x,start+i*lineH))}

function action(act){
  const e=selectedEls()[0];if(!e&&act!=="paste")return;
  if(act==="duplicate")return cloneSelected(); if(act==="delete")return deleteSelected(); if(act==="group")return groupSelected(); if(act==="ungroup")return ungroupSelected();
  if(act==="front"){selectedEls().forEach(x=>x.z=maxZ()+1);commitHistory();render();return}
  if(act==="back"){selectedEls().forEach(x=>x.z=2);commitHistory();render();return}
  if(act==="lock"){e.locked=!e.locked;commitHistory();render();return}
  if(act==="edit"){beginEdit(e.id);return}
  if(act==="cropimage"&&e.type==="image"){cropEditingId=cropEditingId===e.id?null:e.id;render();return}
  if(act==="resetcrop"&&e.type==="image"){e.cropX=50;e.cropY=50;cropEditingId=null;commitHistory();render();return}
  if(act==="bold"){e.style.fontWeight=(e.style.fontWeight>=700||e.style.fontWeight==="bold")?500:700}
  if(act==="italic"){e.style.fontStyle=e.style.fontStyle==="italic"?"normal":"italic"}
  if(act==="underline"){e.style.textDecoration=String(e.style.textDecoration).includes("underline")?"none":"underline"}
  if(act==="strike"){e.style.textDecoration=String(e.style.textDecoration).includes("line-through")?"none":"line-through"}
  if(act==="case"){e.text=(e.text===e.text.toUpperCase()?e.text.toLowerCase():e.text.toUpperCase())}
  if(act==="fsminus")e.style.fontSize=Math.max(6,(+e.style.fontSize||16)-1);
  if(act==="fsplus")e.style.fontSize=Math.min(200,(+e.style.fontSize||16)+1);
  if(act==="row"&&e.type==="table"){e.rows.push(Array(e.rows[0]?.length||3).fill(""))}
  if(act==="col"&&e.type==="table"){e.rows.forEach(r=>r.push(""))}
  commitHistory();render();
}
function handleKey(ev){
  const mod=ev.metaKey||ev.ctrlKey;
  if(editingId){
    if(ev.key==="Escape"){ev.preventDefault();endEdit(true)}
    return;
  }
  if(ev.key===" "){spaceDown=true;return}
  if(mod&&ev.key.toLowerCase()==="z"){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mod&&ev.key.toLowerCase()==="c"){ev.preventDefault();copySelected();return}
  if(mod&&ev.key.toLowerCase()==="v"){ev.preventDefault();paste();return}
  if(mod&&ev.key.toLowerCase()==="x"){ev.preventDefault();copySelected();deleteSelected();return}
  if(mod&&ev.key.toLowerCase()==="d"){ev.preventDefault();cloneSelected();return}
  if(mod&&ev.key.toLowerCase()==="g"){ev.preventDefault();ev.shiftKey?ungroupSelected():groupSelected();return}
  if(mod&&ev.key.toLowerCase()==="a"){ev.preventDefault();state.selectedIds=state.elements.map(e=>e.id);renderSelection();renderTopbar();return}
  if(["Delete","Backspace"].includes(ev.key)){ev.preventDefault();deleteSelected();return}
  if(ev.key==="Escape"){setTool("select");clearSelection();return}
  const k=ev.key.toLowerCase();if(k==="v")setTool("select");if(k==="t")setTool("text");if(k==="r"){setTool("shapes");shapePalette.classList.add("show")}if(k==="l")setTool("line");if(k==="s")setTool("sticky");if(k==="p")setTool("draw");
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(ev.key)&&state.selectedIds.length){
    ev.preventDefault();const d=ev.shiftKey?10:1;selectedEls().forEach(e=>{if(ev.key==="ArrowLeft")e.x-=d;if(ev.key==="ArrowRight")e.x+=d;if(ev.key==="ArrowUp")e.y-=d;if(ev.key==="ArrowDown")e.y+=d});commitHistory();render()
  }
}
